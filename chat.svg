<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220">

  <style>
    .chat-container {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      fill: #c9d1d9;
    }

    .bubble {
      opacity: 0;
      animation: fadeIn 0.3s ease-in-out forwards;
    }

    .bubble rect {
      fill: #2d333b;
      rx: 18px;
    }

    .typing-text {
      clip-path: inset(0 100% 0 0);
    }

    .b1 {
      animation-delay: 0.5s;
    }

    .t1 {
      animation: typeText 0.8s steps(14, end) forwards;
      animation-delay: 0.8s;
    }

    .b2 {
      animation-delay: 2s;
    }

    .t2 {
      animation: typeText 1.7s steps(45, end) forwards;
      animation-delay: 2.3s;
    }

    .b3 {
      animation-delay: 4.3s;
    }

    .t3 {
      animation: typeText 1.8s steps(48, end) forwards;
      animation-delay: 4.6s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes typeText {
      to {
        clip-path: inset(0 0 0 0);
      }
    }
  </style>

  <g class="chat-container">

    <g class="bubble b1" transform="translate(20, 15)">
      <rect width="150" height="46" />
      <text class="typing-text t1" x="22" y="30">
        Hi, I'm Sajib
      </text>
    </g>

    <g class="bubble b2" transform="translate(20, 75)">
      <rect width="310" height="46" />
      <text class="typing-text t2" x="22" y="30">
        CSE Undergraduate @ BUET
      </text>
    </g>

    <g class="bubble b3" transform="translate(20, 135)">
      <rect width="535" height="46" />
      <text class="typing-text t3" x="22" y="30">
        CP · Cybersecurity · Web Development · Data Science · ML
      </text>
    </g>

  </g>

</svg>
